# Theme aligne sur la console Fotia : Horizon Design System de la NASA
# (fond carbon-80, surface carbon-70, accent nasa-blue hsl(217 78% 50%)).
[theme]
base = "dark"
backgroundColor = "#2f2f32"
secondaryBackgroundColor = "#434346"
textColor = "#d1d1d1"
primaryColor = "#1c68e3"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
